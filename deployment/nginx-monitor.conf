server {
    listen 80;
    # Use a dedicated subdomain so this does NOT conflict with cashier-app / cashier-app-client
    server_name monitor.your-domain.com;

    # Dedicated access log (avoids mixing cashier-app traffic into monitor logs)
    access_log /var/log/nginx/monitor-access.log;

    # Recommended: Restrict dashboard access to trusted admin/VPN IPs only
    # allow 10.0.0.0/8;
    # allow 192.168.1.0/24;
    # deny all;

    # Root location for Vite production build static files
    location / {
        root /opt/ubuntu-monitor/dist;
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API requests to localhost-bound Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Socket.io WebSockets for Realtime Telemetry
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
